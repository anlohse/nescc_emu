# Builds a Windows package and publishes it as a GitHub Release.
#
# Two ways in:
#
#   * Push a tag matching v*  -- the normal path. The tag is the version.
#   * Run it by hand          -- give a version; the tag is created for you.
#     This exists for the first release, before any tag exists.
#
# Release notes come from the commit subjects since the previous tag. There is
# no version arithmetic anywhere: the tag is the single source of truth, which
# is why nothing here has to parse commit messages for intent.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with or without the leading v (e.g. 1.0.0)'
        required: true
        type: string
      draft:
        description: 'Publish as a draft, so the notes and package can be checked first'
        required: false
        type: boolean
        default: true
      core_ref:
        description: 'Branch or tag of emu6205cc to build against'
        required: false
        type: string
        default: 'main'

# A second push to the same tag should not race the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # needed to create the tag and the release

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes are a diff between tags.
          fetch-depth: 0

      - name: Work out the version and the previous tag
        id: v
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            tag="v${version}"
            draft="${{ inputs.draft }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            draft="false"
          fi

          # The newest tag reachable from here that is not the one being made.
          # --merged keeps tags from unrelated branches out of the notes.
          previous="$(git tag --sort=-v:refname --merged HEAD \
                      | grep -v -x "${tag}" | head -n 1 || true)"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "previous=${previous}"
            echo "draft=${draft}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag}; previous tag: ${previous:-none (first release)}"

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          # SDL2 and doctest are built from source; the 6502 core is cheap to
          # re-fetch but lands here too.
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Ensure WiX 3 is available
        shell: pwsh
        run: |
          # CPack's WIX generator drives candle.exe and light.exe, which are WiX
          # 3. WiX 4 and later are a dotnet tool with a different command line
          # and will not do -- so this looks for 3 specifically, and installs it
          # rather than assuming the runner image ships it.
          $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Recurse `
              -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset --no-progress -y
            $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Recurse `
                -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candle) { throw 'WiX 3 (candle.exe) not found, and installing it did not produce one' }
          Add-Content -Path $env:GITHUB_PATH -Value $candle.Directory.FullName
          Write-Output "candle: $($candle.FullName)"

      - name: Configure
        shell: bash
        run: |
          # No sibling checkout on a runner, so this also exercises the fetch
          # fallback that lets the repository be cloned on its own.
          #
          # The tag is the only source of truth for the version, so it is handed
          # to CMake rather than kept in a second place that could disagree with
          # it.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNES_VERSION="${{ steps.v.outputs.version }}" \
            -DEMU6502_GIT_TAG="${{ inputs.core_ref || 'main' }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="nescc_emu-${{ steps.v.outputs.version }}-windows-x64"

          # CPack, from the install() rules in CMakeLists.txt, rather than a copy
          # list here. A copy list is a second description of what the package
          # contains, and the two drift the moment a plugin or a DLL is added:
          # the build keeps working and the package quietly ships without it.
          cd build
          cpack -C Release -B "${GITHUB_WORKSPACE}/dist"
          cd "${GITHUB_WORKSPACE}"

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Check the package holds what it should
        shell: bash
        run: |
          set -euo pipefail
          zip="dist/${{ steps.pkg.outputs.name }}.zip"
          msi="dist/${{ steps.pkg.outputs.name }}.msi"

          # An installer missing a DLL still builds, installs, and then fails to
          # start on a machine that is not this one. Both files existing under the
          # names the notes promise is the other half of that.
          test -f "$msi"
          for wanted in nes_gui.exe nes_run.exe SDL2.dll emu6502_lib.dll \
                        plugins/audio_sdl.dll LICENSE README.md; do
            if ! unzip -l "$zip" | grep -q "/${wanted}$"; then
              echo "missing from the package: ${wanted}"
              unzip -l "$zip"
              exit 1
            fi
          done
          if unzip -l "$zip" | grep -qiE 'doctest|/lib/cmake/|/include/'; then
            echo "the package contains files belonging to a dependency"
            unzip -l "$zip"
            exit 1
          fi
          echo "package contents are as expected"

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          previous='${{ steps.v.outputs.previous }}'
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          {
            # An optional hand-written preamble. A generated commit list makes a
            # poor answer to "what is this?", which is exactly what someone
            # reading a first release wants to know.
            if [ -f .github/release-intro.md ]; then
              cat .github/release-intro.md
              echo
            fi

            if [ -n "${previous}" ]; then
              echo "## Changes since ${previous}"
            else
              echo "## History"
            fi
            echo

            if [ -n "${previous}" ]; then
              git log --no-merges --pretty=format:'- %s' "${previous}..HEAD"
            else
              git log --no-merges --pretty=format:'- %s'
            fi
            echo
            echo

            echo "## Download"
            echo
            echo "Windows x64, two ways round — the same files either way."
            echo
            echo "\`${{ steps.pkg.outputs.name }}.msi\` — the installer. Adds a Start"
            echo "Menu entry and a desktop shortcut, and uninstalls from Settings like"
            echo "anything else. Installing a newer version replaces the old one rather"
            echo "than sitting beside it."
            echo
            echo "\`${{ steps.pkg.outputs.name }}.zip\` — the same tree, portable."
            echo "Unzip and run \`nes_gui.exe <rom.nes>\`. Nothing to install and"
            echo "nothing to uninstall."
            echo
            echo "**No ROMs are included or downloaded.** Supply your own."
            echo

            if [ -n "${previous}" ]; then
              echo "**Full changelog**: ${repo}/compare/${previous}...${{ steps.v.outputs.tag }}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Keep the packages on the run as well
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.msi
            dist/${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Creates the tag at this commit when it does not already exist, which
          # is what makes the manual path work before the first tag.
          gh release create "${{ steps.v.outputs.tag }}" \
            "dist/${{ steps.pkg.outputs.name }}.msi" \
            "dist/${{ steps.pkg.outputs.name }}.zip" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file release-notes.md \
            --draft=${{ steps.v.outputs.draft }} \
            --target "${GITHUB_SHA}"
